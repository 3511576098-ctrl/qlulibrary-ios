name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Ad-hoc Signed IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Build Xcode Project Unsigned
        run: |
          xcodebuild clean build \
            -project qlulibrary.xcodeproj \
            -scheme qlulibrary \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Apply Native Ad-hoc Signature and Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/qlulibrary.app"
          
          # Native codesign ad-hoc
          codesign --force --deep --sign - "$APP_PATH"
          codesign -dvvv "$APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y qlulibrary.ipa Payload
          ls -lh qlulibrary.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qlulibrary-signed-ipa
          path: qlulibrary.ipa
          retention-days: 30
