name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Build Xcode Project
        run: |
          xcodebuild clean build \
            -project qlulibrary.xcodeproj \
            -scheme qlulibrary \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Standard IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/qlulibrary.app"
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # Clean any stray code signature so Sideloadly can sign cleanly
          rm -rf Payload/qlulibrary.app/_CodeSignature
          
          # Fix POSIX permissions
          chmod -R 755 Payload
          find Payload -type f -exec chmod 644 {} +
          chmod 755 Payload/qlulibrary.app/qlulibrary
          
          zip -r -y qlulibrary_v2.ipa Payload
          ls -lh qlulibrary_v2.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qlulibrary-v2-ipa
          path: qlulibrary_v2.ipa
          retention-days: 30

